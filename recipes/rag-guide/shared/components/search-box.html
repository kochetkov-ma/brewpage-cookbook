<!--
  search-box.html -- shared client-side full-text site search partial (copy-in
  source of truth). Sits in the header cluster (.site-header__nav) ALONGSIDE the
  back-to-map control + lang-toggle; the i18n lang-toggle was left clean for this.

  Progressive enhancement: wrapped in .js-only because search needs JS; with JS
  off the page relies on nav + in-page anchors. search.js (shared/js/lib) mounts
  on [data-component="search-box"], loads data-index-src, scores the query with
  field weighting (title > heading > body), and renders ranked results into
  [data-slot="results"] as an accessible combobox/listbox linking to page#anchor.

  Accessibility: input role=combobox (aria-expanded / aria-controls /
  aria-activedescendant set by JS); results role=listbox of role=option; a polite
  live region (created by JS) announces the result count. Keyboard: Down/Up move
  the active option, Enter follows, Esc closes, Tab leaves.

  data-i18n on the label + placeholder gives meaningful RU/EN text with JS off.
  data-index-src is RELATIVE TO THE PAGE: root chapter pages use
  "shared/data/search-index.json"; variant pages (variants/<name>/) use
  "../../shared/data/search-index.json". Class hooks only, NO inline styles.
-->
<div class="search-box js-only" data-component="search-box"
     data-index-src="shared/data/search-index.json">
  <label class="visually-hidden" for="rag-search"
         data-i18n="searchLabel" data-ru="Поиск по руководству" data-en="Search the guide">Search the guide</label>
  <input id="rag-search" class="search-box__input" type="search"
         placeholder="Search chapters" autocomplete="off" spellcheck="false"
         data-i18n-ph="searchPh" data-ph-ru="Поиск по главам" data-ph-en="Search chapters"
         role="combobox" aria-autocomplete="list" aria-expanded="false"
         aria-controls="rag-search-results"
         aria-label="Search the guide" data-i18n-aria="searchLabel" data-aria-ru="Поиск по руководству" data-aria-en="Search the guide" />
  <ul id="rag-search-results" class="search-box__results"
      data-slot="results" role="listbox"
      aria-label="Search results" data-i18n-aria="searchResults" data-aria-ru="Результаты поиска" data-aria-en="Search results" hidden></ul>
</div>
