<!--
  compass.html -- compass rose partial (AtlasMD 3.1, copy-in source of truth).
  INERT decoration. HARD RULE: lives in a page TITLE header row only (the
  plate / atlas head), never over or beside a control/toolbar row.
  aria-hidden + focusable=false + pointer-events none (enforced by compass.js).
  NO inline styles beyond the SVG geometry; color is the frozen compass palette.
-->
<svg class="compass" data-component="compass" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
  <circle cx="50" cy="50" r="46" fill="none" stroke="#5c4a32" stroke-width="2"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#7a6446" stroke-width="0.8" stroke-dasharray="2 3"/>
  <g font-family="Georgia, serif" font-size="9" fill="#5c4a32" text-anchor="middle">
    <text x="50" y="16">N</text>
    <text x="86" y="53">E</text>
    <text x="50" y="92">S</text>
    <text x="14" y="53">W</text>
  </g>
  <polygon points="50,22 56,50 50,50" fill="#a55a35"/>
  <polygon points="50,22 44,50 50,50" fill="#c47a55"/>
  <polygon points="50,78 56,50 50,50" fill="#4a6f6a"/>
  <polygon points="50,78 44,50 50,50" fill="#6a8d88"/>
  <circle cx="50" cy="50" r="4" fill="#b08a3e" stroke="#5c4a32" stroke-width="1"/>
</svg>
