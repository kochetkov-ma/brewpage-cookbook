<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG с нуля</title>
<style>
  :root{
    --ink:#161616;
    --cream:#fdf3da;
    --red:#e23636;
    --yellow:#ffd23f;
    --blue:#2d6cdf;
    --paper:#fff8e8;
    --dot:rgba(22,22,22,0.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Arial Black","Arial",Helvetica,sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.4;
    background-image:radial-gradient(var(--dot) 1.4px, transparent 1.5px);
    background-size:14px 14px;
    overflow-x:hidden;
  }
  .display{
    font-family:"Arial Black","Arial Narrow",Arial,sans-serif;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:0.5px;
    transform:scaleY(1.12);
    transform-origin:left center;
  }
  .wrap{max-width:1320px;margin:0 auto;padding:0 20px}

  /* ===== HEADER ===== */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--yellow);
    border-bottom:5px solid var(--ink);
  }
  .hbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:12px 0;
  }
  .brand{
    display:inline-flex;align-items:center;gap:10px;
  }
  .brand .badge{
    background:var(--red);color:var(--paper);
    border:4px solid var(--ink);
    padding:4px 12px;border-radius:6px;
    box-shadow:4px 4px 0 var(--ink);
    font-size:clamp(18px,4vw,30px);
    transform:rotate(-2deg);
  }
  .brand .badge span{display:inline-block}
  .toggle{
    display:inline-flex;border:4px solid var(--ink);
    border-radius:8px;overflow:hidden;
    box-shadow:3px 3px 0 var(--ink);
    background:var(--paper);
  }
  .toggle button{
    font-family:inherit;font-weight:900;
    border:none;background:transparent;color:var(--ink);
    padding:8px 14px;min-height:44px;min-width:48px;cursor:pointer;
    text-transform:uppercase;letter-spacing:1px;font-size:15px;
  }
  .toggle button.active{background:var(--blue);color:var(--paper)}
  .toggle button+button{border-left:4px solid var(--ink)}

  /* ===== HERO ===== */
  .hero{padding:42px 0 24px}
  .hero-panel{
    position:relative;
    background:var(--paper);
    border:6px solid var(--ink);
    border-radius:4px;
    box-shadow:9px 9px 0 var(--ink);
    padding:30px 28px;
    overflow:hidden;
  }
  .hero-panel::before{
    content:"";position:absolute;right:-60px;top:-60px;
    width:240px;height:240px;border-radius:50%;
    background:
      radial-gradient(var(--red) 30%, transparent 32%) 0 0/16px 16px;
    opacity:0.5;pointer-events:none;
  }
  .kapow{
    display:inline-block;background:var(--red);color:var(--paper);
    border:4px solid var(--ink);padding:5px 14px;border-radius:6px;
    box-shadow:4px 4px 0 var(--ink);transform:rotate(-3deg);
    font-size:14px;letter-spacing:2px;margin-bottom:14px;
  }
  .hero h1{
    font-size:clamp(30px,7vw,62px);line-height:1.02;
    margin-bottom:14px;color:var(--ink);max-width:18ch;
  }
  .hero h1 .hl{color:var(--red);-webkit-text-stroke:0}
  .hero p{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:bold;font-size:clamp(16px,2.4vw,20px);
    max-width:46ch;text-transform:none;letter-spacing:0;
  }
  .speech-hero{
    position:relative;margin-top:20px;display:inline-block;
    background:var(--yellow);border:4px solid var(--ink);
    border-radius:18px;padding:12px 18px;
    box-shadow:5px 5px 0 var(--ink);
    font-size:clamp(14px,2.2vw,18px);
    font-family:Georgia,serif;font-weight:bold;
    text-transform:none;letter-spacing:0;
  }
  .speech-hero::after{
    content:"";position:absolute;left:36px;bottom:-18px;
    width:0;height:0;border:14px solid transparent;
    border-top-color:var(--ink);border-bottom:0;
  }
  .speech-hero::before{
    content:"";position:absolute;left:40px;bottom:-11px;
    width:0;height:0;border:10px solid transparent;
    border-top-color:var(--yellow);border-bottom:0;z-index:1;
  }

  /* ===== TRACK ===== */
  .track-head{margin:46px 0 8px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .track-head h2{font-size:clamp(24px,5vw,44px);color:var(--blue)}
  .progress-readout{
    margin-left:auto;background:var(--ink);color:var(--yellow);
    border:4px solid var(--ink);border-radius:6px;
    padding:6px 14px;box-shadow:4px 4px 0 var(--red);
    font-size:18px;letter-spacing:1px;
  }
  .progress-rail{
    height:22px;background:var(--paper);
    border:5px solid var(--ink);border-radius:12px;
    margin:10px 0 30px;overflow:hidden;
    box-shadow:4px 4px 0 var(--ink);
  }
  .progress-fill{
    height:100%;width:0%;
    background:
      repeating-linear-gradient(45deg,var(--red) 0 12px,#c22 12px 24px);
    transition:width .4s ease;
  }
  @media (prefers-reduced-motion:reduce){
    .progress-fill{transition:none}
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
    padding-bottom:50px;
  }
  .panel{
    position:relative;
    background:var(--paper);
    border:5px solid var(--ink);
    border-radius:4px;
    box-shadow:7px 7px 0 var(--ink);
    padding:18px 16px 16px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    text-align:left;font-family:inherit;color:var(--ink);
    width:100%;display:block;
  }
  .panel:nth-child(3n+1){transform:rotate(-0.6deg)}
  .panel:nth-child(3n+2){transform:rotate(0.5deg)}
  .panel:nth-child(3n){transform:rotate(-0.3deg)}
  .panel:hover,.panel:focus-visible{
    transform:translate(-2px,-2px) rotate(0deg);
    box-shadow:11px 11px 0 var(--ink);outline:none;
  }
  .panel.open{box-shadow:11px 11px 0 var(--blue)}
  .panel-top{display:flex;align-items:center;gap:12px}
  .issue{
    flex:0 0 auto;
    background:var(--blue);color:var(--paper);
    border:4px solid var(--ink);border-radius:50%;
    width:54px;height:54px;display:grid;place-items:center;
    font-size:17px;box-shadow:3px 3px 0 var(--ink);
  }
  .panel:nth-child(3n+2) .issue{background:var(--red)}
  .panel:nth-child(3n) .issue{background:var(--yellow);color:var(--ink)}
  .panel-title{
    font-size:clamp(15px,2.2vw,18px);line-height:1.1;
  }
  .halftone-strip{
    height:14px;margin:14px 0 0;border-radius:4px;
    background:radial-gradient(var(--blue) 26%, transparent 28%) 0 0/9px 9px;
    opacity:0.55;
  }
  .bubble{
    display:none;
    position:relative;margin-top:16px;
    background:var(--cream);
    border:4px solid var(--ink);border-radius:16px;
    padding:14px 14px 12px;
    box-shadow:4px 4px 0 var(--ink);
    font-family:Georgia,"Times New Roman",serif;
    text-transform:none;letter-spacing:0;font-weight:normal;
  }
  .bubble::after{
    content:"";position:absolute;left:28px;top:-16px;
    width:0;height:0;border:12px solid transparent;
    border-bottom-color:var(--ink);border-top:0;
  }
  .bubble::before{
    content:"";position:absolute;left:31px;top:-9px;
    width:0;height:0;border:9px solid transparent;
    border-bottom-color:var(--cream);border-top:0;z-index:1;
  }
  .panel.open .bubble{display:block;animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .panel.open .bubble{animation:none}
    .panel{transition:none}
  }
  .blurb{font-size:15.5px;font-weight:bold;margin-bottom:8px}
  .bubble ul{list-style:none;padding:0}
  .bubble li{
    position:relative;padding-left:22px;margin:5px 0;font-size:14.5px;
  }
  .bubble li::before{
    content:"";position:absolute;left:2px;top:7px;
    width:10px;height:10px;background:var(--red);
    border:2px solid var(--ink);border-radius:50%;
  }
  .pct-tag{
    display:inline-block;margin-top:2px;font-family:inherit;
    background:var(--ink);color:var(--yellow);
    font-size:12px;padding:2px 8px;border-radius:4px;letter-spacing:1px;
  }

  /* ===== FOOTER ===== */
  footer{
    border-top:6px solid var(--ink);
    background:var(--ink);color:var(--cream);
    padding:26px 0;
  }
  footer .wrap{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;justify-content:space-between}
  footer .fbrand{font-size:18px;color:var(--yellow)}
  footer .flinks{display:flex;gap:18px;flex-wrap:wrap}
  footer a{
    color:var(--cream);text-decoration:none;
    font-family:Georgia,serif;font-weight:bold;font-size:14px;
    border-bottom:2px dotted var(--yellow);padding-bottom:2px;
  }
  footer a:hover{color:var(--yellow)}

  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:480px){
    .grid{grid-template-columns:1fr;gap:18px}
    .hero-panel{box-shadow:6px 6px 0 var(--ink)}
    .panel{transform:none !important}
    .progress-readout{margin-left:0}
    .track-head{margin-top:34px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <div class="brand">
      <span class="badge display" data-i18n="brand">RAG с нуля</span>
    </div>
    <div class="toggle" role="group" aria-label="language">
      <button id="btn-ru" class="active" onclick="setLang('ru')">RU</button>
      <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>
</header>

<main>
  <section class="hero wrap">
    <div class="hero-panel">
      <span class="kapow display" data-i18n="kapow">Выпуск #0</span>
      <h1 class="display"><span data-i18n="heroH"></span></h1>
      <p data-i18n="heroP"></p>
      <div class="speech-hero" data-i18n="heroBubble"></div>
    </div>
  </section>

  <section class="wrap">
    <div class="track-head">
      <h2 class="display" data-i18n="trackH">Маршрут обучения</h2>
      <div class="progress-readout"><span id="pctNow">0</span>%</div>
    </div>
    <div class="progress-rail"><div class="progress-fill" id="fill"></div></div>

    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span class="fbrand display" data-i18n="brand">RAG с нуля</span>
    <div class="flinks">
      <a href="https://brewpage.app" data-i18n="f1">brewpage.app</a>
      <a href="https://github.com/kochetkov-ma/brewpage-openapi" data-i18n="f2">brewpage-openapi</a>
    </div>
  </div>
</footer>

<script>
"use strict";

var STR = {
  ru:{
    brand:"RAG с нуля",
    kapow:"Выпуск #0",
    heroH:"От 0 до 100% без подготовки",
    heroP:"Пошаговый гайд для новичков: от 0 до 100%. Без подготовки, всё на одной странице.",
    heroBubble:"Открывай панели по порядку и листай как комикс!",
    trackH:"Маршрут обучения",
    f1:"brewpage.app",
    f2:"brewpage-openapi",
    open:"Открыть панель",
    stops:[
      {p:"0%", t:"С чего начать", b:"Знакомимся с гайдом и понимаем, что нам вообще предстоит.",
       s:["Никаких требований - начинаем с чистого листа","Что такое RAG в двух словах","Как читать этот комикс-гайд"]},
      {p:"1", t:"Что такое RAG", b:"RAG = поиск нужных кусочков текста плюс генерация ответа моделью.",
       s:["Retrieval - находим факты в документах","Augmented - добавляем их в запрос","Generation - модель пишет ответ"]},
      {p:"2", t:"Зачем он нужен", b:"Модель отвечает по вашим данным и реже выдумывает.",
       s:["Свежие и приватные знания","Меньше галлюцинаций","Ссылки на источник ответа"]},
      {p:"3", t:"Как работает поиск по документам", b:"Сначала находим релевантные фрагменты, потом отдаём их модели.",
       s:["Запрос пользователя","Поиск похожих фрагментов","Передача найденного в модель"]},
      {p:"4", t:"Разбиваем текст на чанки", b:"Длинные документы режем на небольшие осмысленные кусочки.",
       s:["Размер чанка и перекрытие","Сохраняем смысл абзаца","Метаданные у каждого чанка"]},
      {p:"5", t:"Эмбеддинги: текст в векторы", b:"Каждый чанк превращаем в набор чисел, отражающих смысл.",
       s:["Похожий смысл - близкие векторы","Одна модель для базы и запроса","Размерность вектора"]},
      {p:"6", t:"Векторная база и поиск", b:"Векторы складываем в базу и ищем ближайших соседей.",
       s:["Хранилище векторов","Поиск по близости","Top-k самых релевантных"]},
      {p:"7", t:"Собираем контекст для модели", b:"Найденные фрагменты складываем в один аккуратный промпт.",
       s:["Шаблон промпта","Лимит токенов контекста","Порядок и приоритет фрагментов"]},
      {p:"8", t:"Генерация ответа", b:"Модель читает контекст и пишет ответ строго по нему.",
       s:["Инструкция отвечать по контексту","Добавляем цитаты и ссылки","Что делать, если ответа нет"]},
      {p:"9", t:"Оценка качества", b:"Проверяем, точны ли ответы и хорош ли поиск.",
       s:["Релевантность найденного","Точность и достоверность ответа","Тестовый набор вопросов"]},
      {p:"100%", t:"Вывод в продакшн", b:"Запускаем RAG в реальную работу и следим за ним.",
       s:["Кэш и стоимость запросов","Логи и мониторинг","Обновление документов"]}
    ]
  },
  en:{
    brand:"RAG from zero",
    kapow:"Issue #0",
    heroH:"From 0 to 100% with no prep",
    heroP:"A step-by-step guide for beginners: from 0 to 100%. No prerequisites, all on one page.",
    heroBubble:"Open the panels in order and read it like a comic!",
    trackH:"Learning track",
    f1:"brewpage.app",
    f2:"brewpage-openapi",
    open:"Open panel",
    stops:[
      {p:"0%", t:"Where to start", b:"Meet the guide and see what is ahead of us.",
       s:["No requirements - start from scratch","What RAG is in one breath","How to read this comic guide"]},
      {p:"1", t:"What RAG is", b:"RAG = finding the right text snippets plus letting a model generate the answer.",
       s:["Retrieval - find facts in documents","Augmented - add them to the prompt","Generation - the model writes the answer"]},
      {p:"2", t:"Why you need it", b:"The model answers from your data and makes things up less.",
       s:["Fresh and private knowledge","Fewer hallucinations","Links to the source of the answer"]},
      {p:"3", t:"How document retrieval works", b:"First find relevant fragments, then hand them to the model.",
       s:["The user query","Search for similar fragments","Pass the matches to the model"]},
      {p:"4", t:"Splitting text into chunks", b:"Cut long documents into small meaningful pieces.",
       s:["Chunk size and overlap","Keep the meaning of a paragraph","Metadata on each chunk"]},
      {p:"5", t:"Embeddings: text to vectors", b:"Turn each chunk into numbers that capture its meaning.",
       s:["Similar meaning - close vectors","One model for store and query","Vector dimensionality"]},
      {p:"6", t:"Vector store and search", b:"Put vectors in a store and search for nearest neighbours.",
       s:["The vector store","Similarity search","Top-k most relevant"]},
      {p:"7", t:"Assembling context for the model", b:"Pack the found fragments into one tidy prompt.",
       s:["Prompt template","Context token limit","Order and priority of fragments"]},
      {p:"8", t:"Generating the answer", b:"The model reads the context and answers strictly from it.",
       s:["Instruct it to answer from context","Add citations and links","What to do when there is no answer"]},
      {p:"9", t:"Measuring quality", b:"Check whether answers are accurate and retrieval is good.",
       s:["Relevance of retrieved text","Answer accuracy and faithfulness","A test set of questions"]},
      {p:"100%", t:"Going to production", b:"Ship RAG into real use and keep an eye on it.",
       s:["Cache and request cost","Logs and monitoring","Refreshing documents"]}
    ]
  }
};

var lang = "ru";
var openIdx = -1;

function buildGrid(){
  var d = STR[lang];
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  d.stops.forEach(function(st, i){
    var btn = document.createElement("button");
    btn.className = "panel" + (i === openIdx ? " open" : "");
    btn.setAttribute("aria-expanded", i === openIdx ? "true" : "false");
    btn.setAttribute("aria-label", d.open + " " + st.t);
    btn.onclick = function(){ toggle(i); };

    var li = st.s.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("");
    btn.innerHTML =
      '<div class="panel-top">' +
        '<span class="issue display">' + esc(st.p) + '</span>' +
        '<span class="panel-title display">' + esc(st.t) + '</span>' +
      '</div>' +
      '<div class="halftone-strip"></div>' +
      '<div class="bubble">' +
        '<span class="pct-tag">' + esc(st.p) + '</span>' +
        '<p class="blurb">' + esc(st.b) + '</p>' +
        '<ul>' + li + '</ul>' +
      '</div>';
    grid.appendChild(btn);
  });
}

function toggle(i){
  openIdx = (openIdx === i) ? -1 : i;
  buildGrid();
  updateProgress();
}

function updateProgress(){
  var total = STR[lang].stops.length - 1;
  var pct = openIdx < 0 ? 0 : Math.round((openIdx / total) * 100);
  document.getElementById("fill").style.width = pct + "%";
  document.getElementById("pctNow").textContent = pct;
}

function applyStatic(){
  var d = STR[lang];
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i=0;i<nodes.length;i++){
    var k = nodes[i].getAttribute("data-i18n");
    if (k in d && typeof d[k] === "string") nodes[i].textContent = d[k];
  }
}

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.getElementById("btn-ru").classList.toggle("active", l==="ru");
  document.getElementById("btn-en").classList.toggle("active", l==="en");
  applyStatic();
  buildGrid();
  updateProgress();
}

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}

applyStatic();
buildGrid();
updateProgress();
</script>

</body>
