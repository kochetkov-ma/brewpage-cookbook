<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG с нуля</title>
<style>
  :root{
    --paper:#fdfcf4;
    --line:#cfe0ef;
    --margin:#e8a3a3;
    --ink:#2b2a33;
    --ink-soft:#54525e;
    --accent:#3a6ea5;
    --hi-yellow:#fff3a3;
    --hi-pink:#ffc8d8;
    --hi-green:#bdeec3;
    --note1:#fff6b0;
    --note2:#ffd9c4;
    --note3:#c8e9ff;
    --note4:#dcf0c0;
    --tape:rgba(243,225,143,0.6);
    --done:#3a8a4f;
    --hand:"Bradley Hand","Comic Sans MS","Segoe Print",cursive;
    --body:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--body);
    color:var(--ink);
    line-height:1.55;
    background:var(--paper);
    /* ruled notebook lines + faint vertical grid hint */
    background-image:
      repeating-linear-gradient(to bottom,
        transparent 0,
        transparent 35px,
        var(--line) 35px,
        var(--line) 36px);
    background-position:0 96px;
  }
  .sheet{
    max-width:1180px;
    margin:0 auto;
    padding:0 24px 80px 96px;
    position:relative;
  }
  /* left margin rule */
  .sheet::before{
    content:"";
    position:absolute;
    top:0;bottom:0;
    left:64px;
    width:2px;
    background:var(--margin);
    opacity:.65;
  }
  @media (max-width:480px){
    .sheet{padding:0 14px 60px 44px}
    .sheet::before{left:26px}
    body{background-position:0 120px}
  }

  /* HEADER */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    padding:22px 0 14px;
  }
  .brand{
    font-family:var(--hand);
    font-size:30px;
    font-weight:700;
    color:var(--ink);
    margin:0;
    line-height:1.1;
  }
  .brand .swipe{
    background:linear-gradient(transparent 55%, var(--hi-yellow) 55%);
    padding:0 4px;
  }
  .toggle{
    display:inline-flex;
    border:2px solid var(--ink);
    border-radius:24px;
    overflow:hidden;
    background:#fff;
    box-shadow:1px 2px 0 rgba(0,0,0,.12);
  }
  .toggle button{
    font-family:var(--hand);
    font-size:16px;
    border:0;
    background:transparent;
    color:var(--ink);
    padding:8px 18px;
    min-height:44px;
    cursor:pointer;
  }
  .toggle button.active{background:var(--accent);color:#fff}
  .toggle button:focus-visible{outline:3px solid var(--margin);outline-offset:2px}

  /* HERO */
  .hero{
    position:relative;
    margin:14px 0 34px;
    padding:26px 26px 30px;
    background:#fffdf2;
    border:1px solid #ece4c4;
    border-radius:6px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    transform:rotate(-0.5deg);
  }
  .hero::before{ /* washi tape */
    content:"";
    position:absolute;
    top:-14px;left:50%;
    width:140px;height:30px;
    transform:translateX(-50%) rotate(-2deg);
    background:var(--tape);
    border-left:1px dashed rgba(0,0,0,.15);
    border-right:1px dashed rgba(0,0,0,.15);
  }
  .hero h2{
    font-family:var(--hand);
    font-size:clamp(26px,5vw,40px);
    margin:6px 0 12px;
    line-height:1.15;
  }
  .hero p{
    font-size:18px;
    color:var(--ink-soft);
    margin:0;
    max-width:60ch;
  }
  .hero .doodle{position:absolute;right:18px;bottom:8px;opacity:.8}
  @media (max-width:480px){.hero .doodle{display:none}}

  .kicker{
    font-family:var(--hand);
    font-size:20px;
    color:var(--accent);
    margin:34px 0 6px;
  }
  .kicker u{text-decoration:none;border-bottom:3px solid var(--hi-pink)}

  /* PROGRESS */
  .prog-wrap{
    display:flex;align-items:center;gap:14px;
    margin:8px 0 26px;
  }
  .prog-track{
    flex:1;
    height:14px;
    background:#fff;
    border:2px solid var(--ink);
    border-radius:10px;
    overflow:hidden;
  }
  .prog-fill{
    height:100%;
    width:0%;
    background:repeating-linear-gradient(45deg,var(--hi-green),var(--hi-green) 8px,#a9e2b1 8px,#a9e2b1 16px);
    transition:width .4s ease;
  }
  .prog-num{
    font-family:var(--hand);
    font-size:22px;
    min-width:62px;
    text-align:right;
    color:var(--done);
  }
  @media (prefers-reduced-motion:reduce){.prog-fill{transition:none}}

  /* ROADMAP */
  .roadmap{list-style:none;margin:0;padding:0;position:relative}
  .stop{
    position:relative;
    margin:0 0 16px;
  }
  .sticky{
    width:100%;
    text-align:left;
    cursor:pointer;
    border:1px solid rgba(0,0,0,.12);
    border-radius:4px;
    padding:14px 16px 14px 52px;
    font-family:var(--body);
    font-size:17px;
    color:var(--ink);
    box-shadow:2px 3px 8px rgba(0,0,0,.10);
    position:relative;
    transition:transform .18s ease, box-shadow .18s ease;
    display:flex;align-items:center;gap:10px;
    min-height:44px;
  }
  .stop:nth-child(5n+1) .sticky{background:var(--note1);transform:rotate(-0.6deg)}
  .stop:nth-child(5n+2) .sticky{background:var(--note2);transform:rotate(0.5deg)}
  .stop:nth-child(5n+3) .sticky{background:var(--note3);transform:rotate(-0.4deg)}
  .stop:nth-child(5n+4) .sticky{background:var(--note4);transform:rotate(0.7deg)}
  .stop:nth-child(5n+5) .sticky{background:#ffe0ec;transform:rotate(-0.5deg)}
  .sticky:hover{transform:rotate(0deg) translateY(-2px);box-shadow:3px 5px 12px rgba(0,0,0,.16)}
  .sticky:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

  /* checkbox marker */
  .mark{
    position:absolute;
    left:14px;top:50%;
    transform:translateY(-50%);
    width:24px;height:24px;
    border:2px solid var(--ink);
    border-radius:5px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--hand);
    font-size:18px;
    color:var(--done);
  }
  .stop.open .mark::after{content:"v";font-weight:700}

  .pct{
    font-family:var(--hand);
    font-size:18px;
    color:var(--accent);
    margin-left:auto;
    white-space:nowrap;
  }
  .stop.open .sticky .pct{color:var(--done)}

  .caret{
    font-family:var(--hand);
    color:var(--ink-soft);
    transition:transform .2s ease;
  }
  .stop.open .caret{transform:rotate(90deg)}
  @media (prefers-reduced-motion:reduce){
    .sticky,.caret{transition:none}
  }

  .panel{
    overflow:hidden;
    max-height:0;
    transition:max-height .28s ease;
  }
  .stop.open .panel{max-height:420px}
  @media (prefers-reduced-motion:reduce){.panel{transition:none}}
  .panel-inner{
    margin:8px 0 4px 30px;
    padding:14px 18px;
    background:#fffef7;
    border-left:4px solid var(--margin);
    border-radius:0 6px 6px 0;
    box-shadow:0 1px 6px rgba(0,0,0,.06);
  }
  .panel-inner .blurb{
    font-size:16px;color:var(--ink-soft);margin:0 0 8px;
  }
  .panel-inner ul{margin:0;padding-left:22px}
  .panel-inner li{margin:4px 0;font-size:15px}
  .panel-inner li::marker{color:var(--accent)}

  /* FOOTER */
  footer{
    margin-top:46px;
    padding-top:18px;
    border-top:2px dashed var(--margin);
    font-size:14px;
    color:var(--ink-soft);
    text-align:center;
  }
  footer a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--hi-yellow)}
  footer a:hover{border-bottom-color:var(--accent)}
  footer .hand{font-family:var(--hand);font-size:16px;display:block;margin-bottom:8px;color:var(--ink)}
</style>
</head>
<body>
<div class="sheet">

  <header>
    <h1 class="brand"><span class="swipe" data-ru="RAG с нуля" data-en="RAG from zero">RAG с нуля</span></h1>
    <div class="toggle" role="group" aria-label="Language / Язык">
      <button id="btn-ru" class="active" onclick="setLang('ru')">RU</button>
      <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <section class="hero" aria-labelledby="hero-h">
    <h2 id="hero-h" data-ru="Давай разберёмся вместе." data-en="Let's figure it out together."></h2>
    <p data-ru="Пошаговый гайд для новичков: от 0 до 100%. Без подготовки, всё на одной странице."
       data-en="A step-by-step guide for beginners: from 0 to 100%. No prerequisites, all on one page."></p>
    <svg class="doodle" width="90" height="46" viewBox="0 0 90 46" aria-hidden="true">
      <path d="M4 30 C 30 8, 56 8, 78 24" fill="none" stroke="#e8a3a3" stroke-width="3" stroke-linecap="round"/>
      <path d="M70 16 L80 24 L70 30" fill="none" stroke="#e8a3a3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </section>

  <p class="kicker" data-ru="Мой маршрут на сегодня:" data-en="My route for today:"></p>

  <div class="prog-wrap" aria-hidden="true">
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    <div class="prog-num" id="progNum">0%</div>
  </div>

  <ul class="roadmap" id="roadmap"></ul>

  <footer>
    <span class="hand" data-ru="Дочитал до конца? Ты молодец." data-en="Made it to the end? Nice work."></span>
    <span data-ru="Сделано на " data-en="Built on "></span>
    <a href="https://brewpage.app" target="_blank" rel="noopener">brewpage.app</a>
    <span> &middot; </span>
    <a href="https://github.com/kochetkov-ma/brewpage-openapi" target="_blank" rel="noopener">brewpage-openapi</a>
  </footer>

</div>

<script>
  var STOPS = [
    {label:"0%", pct:"0%",
     t_ru:"С чего начать", t_en:"Where to start",
     b_ru:"Просто пройди этот список сверху вниз - подготовки не нужно.",
     b_en:"Just go through this list top to bottom - no prep required.",
     s_ru:["Открой страницу и не спеши","Раскрывай заметки по одной","Возвращайся к непонятному позже"],
     s_en:["Open the page and take your time","Expand notes one at a time","Come back to tricky bits later"]},
    {label:"1", pct:"10%",
     t_ru:"Что такое RAG", t_en:"What RAG is",
     b_ru:"RAG - это когда модель сначала находит нужные документы, а потом отвечает на их основе.",
     b_en:"RAG is when the model first finds relevant documents, then answers using them.",
     s_ru:["Retrieval = поиск фактов","Augmented = добавляем их в запрос","Generation = модель пишет ответ"],
     s_en:["Retrieval = find the facts","Augmented = add them to the prompt","Generation = model writes the answer"]},
    {label:"2", pct:"20%",
     t_ru:"Зачем он нужен", t_en:"Why you need it",
     b_ru:"Чтобы модель отвечала по твоим данным и реже выдумывала.",
     b_en:"So the model answers from your data and makes things up less often.",
     s_ru:["Свежие и приватные данные","Меньше галлюцинаций","Ссылки на источник"],
     s_en:["Fresh and private data","Fewer hallucinations","Links back to the source"]},
    {label:"3", pct:"30%",
     t_ru:"Как работает поиск по документам", t_en:"How document retrieval works",
     b_ru:"По запросу мы достаём самые похожие кусочки текста из своей коллекции.",
     b_en:"For a query we pull the most similar pieces of text from our collection.",
     s_ru:["Запрос превращаем в число","Ищем близкие по смыслу куски","Берём топ несколько штук"],
     s_en:["Turn the query into numbers","Find pieces close in meaning","Take the top few"]},
    {label:"4", pct:"40%",
     t_ru:"Разбиваем текст на чанки", t_en:"Splitting text into chunks",
     b_ru:"Большие документы режем на небольшие куски, чтобы их было удобно искать.",
     b_en:"Big documents are cut into small pieces so they are easy to search.",
     s_ru:["Куски по смыслу, не как попало","Небольшое перекрытие между ними","Размер подбирают опытным путём"],
     s_en:["Split by meaning, not at random","A small overlap between pieces","Tune the size by experiment"]},
    {label:"5", pct:"50%",
     t_ru:"Эмбеддинги: текст в векторы", t_en:"Embeddings: text to vectors",
     b_ru:"Каждый кусок текста превращаем в список чисел, отражающий его смысл.",
     b_en:"Each piece of text becomes a list of numbers capturing its meaning.",
     s_ru:["Похожий смысл - близкие числа","Одна модель для всех кусков","Считаем один раз заранее"],
     s_en:["Similar meaning - close numbers","One model for every piece","Compute once, ahead of time"]},
    {label:"6", pct:"60%",
     t_ru:"Векторная база и поиск", t_en:"Vector store and search",
     b_ru:"Векторы храним в базе, которая быстро находит ближайшие к запросу.",
     b_en:"Vectors live in a store that quickly finds the nearest to the query.",
     s_ru:["Хранит векторы и их текст","Ищет ближайших соседей","Отдаёт результат за миллисекунды"],
     s_en:["Holds vectors plus their text","Finds nearest neighbours","Returns results in milliseconds"]},
    {label:"7", pct:"70%",
     t_ru:"Собираем контекст для модели", t_en:"Assembling context for the model",
     b_ru:"Найденные куски склеиваем с вопросом в один аккуратный запрос.",
     b_en:"We glue the found pieces together with the question into one tidy prompt.",
     s_ru:["Сначала инструкция, потом факты","Следим за лимитом токенов","Помечаем, где источник"],
     s_en:["Instruction first, then facts","Watch the token limit","Mark where each source is"]},
    {label:"8", pct:"80%",
     t_ru:"Генерация ответа", t_en:"Generating the answer",
     b_ru:"Модель читает контекст и пишет ответ только по нему.",
     b_en:"The model reads the context and writes an answer based only on it.",
     s_ru:["Просим опираться на факты","Просим указать источник","Низкая температура для точности"],
     s_en:["Ask it to rely on the facts","Ask it to cite the source","Low temperature for accuracy"]},
    {label:"9", pct:"90%",
     t_ru:"Оценка качества", t_en:"Measuring quality",
     b_ru:"Проверяем, точны ли ответы и нашлись ли нужные куски.",
     b_en:"We check whether answers are accurate and the right pieces were found.",
     s_ru:["Тестовые вопросы с ответами","Смотрим точность поиска","Чиним то, что промахивается"],
     s_en:["Test questions with answers","Look at retrieval accuracy","Fix what keeps missing"]},
    {label:"100%", pct:"100%",
     t_ru:"Вывод в продакшн", t_en:"Going to production",
     b_ru:"Собираем всё вместе и аккуратно выкатываем для реальных пользователей.",
     b_en:"Put it all together and ship carefully for real users.",
     s_ru:["Логи и мониторинг","Кэш и контроль расходов","Регулярно обновляем данные"],
     s_en:["Logs and monitoring","Cache and cost control","Refresh the data regularly"]}
  ];

  var lang = "ru";

  function buildRoadmap(){
    var ul = document.getElementById("roadmap");
    var html = "";
    for(var i=0;i<STOPS.length;i++){
      var s = STOPS[i];
      html +=
        '<li class="stop" id="stop'+i+'">'+
          '<button class="sticky" aria-expanded="false" aria-controls="panel'+i+'" onclick="toggleStop('+i+')">'+
            '<span class="mark" aria-hidden="true"></span>'+
            '<span class="ttl" data-ru="'+s.t_ru+'" data-en="'+s.t_en+'">'+s.t_ru+'</span>'+
            '<span class="pct">'+s.label+'</span>'+
            '<span class="caret" aria-hidden="true">&gt;</span>'+
          '</button>'+
          '<div class="panel" id="panel'+i+'" role="region">'+
            '<div class="panel-inner">'+
              '<p class="blurb" data-ru="'+s.b_ru+'" data-en="'+s.b_en+'">'+s.b_ru+'</p>'+
              '<ul>'+
                '<li data-ru="'+s.s_ru[0]+'" data-en="'+s.s_en[0]+'">'+s.s_ru[0]+'</li>'+
                '<li data-ru="'+s.s_ru[1]+'" data-en="'+s.s_en[1]+'">'+s.s_ru[1]+'</li>'+
                (s.s_ru[2]?'<li data-ru="'+s.s_ru[2]+'" data-en="'+s.s_en[2]+'">'+s.s_ru[2]+'</li>':'')+
              '</ul>'+
            '</div>'+
          '</div>'+
        '</li>';
    }
    ul.innerHTML = html;
  }

  function setProgress(pctStr){
    var n = parseInt(pctStr,10) || 0;
    document.getElementById("progFill").style.width = n + "%";
    document.getElementById("progNum").textContent = n + "%";
  }

  function toggleStop(i){
    var stop = document.getElementById("stop"+i);
    var btn = stop.querySelector(".sticky");
    var open = stop.classList.toggle("open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    if(open){ setProgress(STOPS[i].pct); }
  }

  function setLang(l){
    lang = l;
    document.documentElement.lang = l;
    var nodes = document.querySelectorAll("[data-ru]");
    for(var i=0;i<nodes.length;i++){
      nodes[i].textContent = nodes[i].getAttribute("data-"+l);
    }
    document.getElementById("btn-ru").classList.toggle("active", l==="ru");
    document.getElementById("btn-en").classList.toggle("active", l==="en");
    document.title = (l==="ru") ? "RAG с нуля" : "RAG from zero";
  }

  buildRoadmap();
  setLang("ru");
  setProgress("0%");
</script>

</body>
</html>
