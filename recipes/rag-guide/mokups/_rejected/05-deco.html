<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG с нуля</title>
<style>
  :root{
    --ink:#0c1410;          /* deep charcoal-emerald ground */
    --ink-2:#0f1b15;
    --panel:#10211a;
    --emerald:#0d3a2c;
    --gold:#c9a24b;
    --gold-soft:#e3c987;
    --gold-dim:#7d6a3a;
    --line:rgba(201,162,75,.32);
    --line-soft:rgba(201,162,75,.16);
    --text:#ece6d6;
    --text-dim:#bdb59c;
    --serif:"Hoefler Text","Big Caslon","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --disp:"Didot","Bodoni MT","Playfair Display",var(--serif);
    --sans:"Optima","Gill Sans","Gill Sans MT",Futura,"Century Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #163a2c33, transparent 60%),
      radial-gradient(900px 500px at 50% 120%, #163a2c22, transparent 60%),
      var(--ink);
    color:var(--text);
    font-family:var(--serif);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:0 28px}

  /* ---- header ---- */
  header{
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .hbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:22px 0;
  }
  .brand{display:flex;align-items:center;gap:14px}
  .brand .mark{flex:0 0 auto}
  .brand .name{
    font-family:var(--disp);
    font-weight:600;
    letter-spacing:.22em;
    text-transform:uppercase;
    font-size:18px;
    color:var(--gold-soft);
  }
  .toggle{
    display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;
    background:#0b1712;
  }
  .toggle button{
    appearance:none;border:0;background:transparent;color:var(--text-dim);
    font-family:var(--sans);font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    padding:11px 16px;min-height:44px;cursor:pointer;transition:color .2s,background .2s;
  }
  .toggle button[aria-pressed="true"]{
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    color:#10211a;font-weight:600;
  }
  .toggle button+button{border-left:1px solid var(--line)}

  /* ---- hero ---- */
  .hero{padding:74px 0 56px;text-align:center;position:relative}
  .sun{display:block;margin:0 auto 26px}
  .eyebrow{
    font-family:var(--sans);letter-spacing:.5em;text-transform:uppercase;
    font-size:12px;color:var(--gold);margin:0 0 20px;
  }
  .hero h1{
    font-family:var(--disp);font-weight:600;
    font-size:clamp(40px,8vw,86px);line-height:1.02;margin:0 0 22px;
    letter-spacing:.02em;color:#fbf6e9;
  }
  .hero h1 .amp{color:var(--gold-soft);font-style:italic}
  .lede{
    max-width:640px;margin:0 auto;font-size:clamp(17px,2.4vw,21px);
    color:var(--text-dim);font-style:italic;
  }
  .rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:34px auto 0;max-width:420px}
  .rule .ln{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line),transparent)}
  .rule .dot{width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}

  /* ---- track ---- */
  .track-head{text-align:center;margin:18px 0 40px}
  .track-head .ttl{
    font-family:var(--disp);font-size:clamp(26px,4vw,40px);color:#fbf6e9;margin:0 0 8px;letter-spacing:.04em;
  }
  .track-head .sub{font-family:var(--sans);letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--gold)}

  .ladder{position:relative;max-width:780px;margin:0 auto 30px;padding:0 6px}
  /* central fluted spine */
  .ladder:before{
    content:"";position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
    width:10px;
    background:
      linear-gradient(90deg,transparent,var(--line-soft) 2px,transparent 3px) 0 0/4px 100%,
      linear-gradient(180deg,var(--gold-dim),transparent);
    opacity:.6;
  }
  @media(max-width:640px){.ladder:before{left:26px}}

  .stop{position:relative;margin:0 0 14px}
  .frame{
    border:1px solid var(--line);
    background:linear-gradient(180deg,#11221b,#0d1a14);
    position:relative;
  }
  .frame:before,.frame:after{
    content:"";position:absolute;width:14px;height:14px;border:1px solid var(--gold);opacity:.7;
  }
  .frame:before{top:6px;left:6px;border-right:0;border-bottom:0}
  .frame:after{top:6px;right:6px;border-left:0;border-bottom:0}

  .stopbtn{
    width:100%;appearance:none;background:transparent;border:0;cursor:pointer;color:inherit;
    display:grid;grid-template-columns:74px 1fr 28px;align-items:center;gap:16px;
    padding:18px 20px;text-align:left;min-height:44px;font-family:inherit;
  }
  .pct{
    font-family:var(--disp);font-size:24px;color:var(--gold-soft);letter-spacing:.04em;
    text-align:center;line-height:1;
  }
  .pct small{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.22em;color:var(--gold-dim);margin-top:5px}
  .stoptitle{
    font-family:var(--disp);font-size:clamp(18px,3vw,23px);color:#f4ecd9;letter-spacing:.03em;
  }
  .chev{justify-self:end;color:var(--gold);transition:transform .3s ease}
  .stop.open .chev{transform:rotate(180deg)}

  .panel{
    overflow:hidden;max-height:0;transition:max-height .42s ease;
    border-top:1px solid transparent;
  }
  .stop.open .panel{max-height:420px;border-top:1px solid var(--line-soft)}
  .panel-in{padding:6px 24px 24px 76px}
  .blurb{font-style:italic;color:var(--text);margin:14px 0 14px;font-size:17px}
  .subs{list-style:none;margin:0;padding:0;display:grid;gap:9px}
  .subs li{position:relative;padding-left:24px;color:var(--text-dim);font-size:15px;font-family:var(--sans)}
  .subs li:before{
    content:"";position:absolute;left:4px;top:8px;width:8px;height:8px;
    background:var(--gold);transform:rotate(45deg);
  }

  /* progress meter */
  .meter{max-width:780px;margin:0 auto 12px;display:flex;align-items:center;gap:14px}
  .meter .bar{flex:1;height:6px;background:#0b1712;border:1px solid var(--line-soft);position:relative;overflow:hidden}
  .meter .fill{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--gold-dim),var(--gold-soft));transition:width .5s ease}
  .meter .lbl{font-family:var(--disp);font-size:18px;color:var(--gold-soft);min-width:54px;text-align:right}
  .meter .cap{font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);min-width:96px}

  /* ---- footer ---- */
  footer{border-top:1px solid var(--line);margin-top:64px}
  .fbar{padding:36px 0 48px;text-align:center}
  .fan{margin:0 auto 18px}
  .flinks{font-family:var(--sans);letter-spacing:.14em;text-transform:uppercase;font-size:12px}
  .flinks a{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--line-soft);padding-bottom:2px}
  .flinks a:hover{color:var(--gold-soft);border-color:var(--gold)}
  .flinks .sep{display:inline-block;width:6px;height:6px;background:var(--gold-dim);transform:rotate(45deg);margin:0 16px;vertical-align:middle}
  .fnote{margin-top:14px;font-family:var(--sans);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dim)}

  @media(max-width:640px){
    .stopbtn{grid-template-columns:58px 1fr 22px;gap:10px;padding:16px 16px 16px 14px}
    .panel-in{padding:4px 18px 20px 18px}
    .meter{flex-wrap:wrap}.meter .cap{min-width:auto}
  }
  @media(prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>
<header>
  <div class="wrap hbar">
    <div class="brand">
      <svg class="mark" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <g fill="none" stroke="#c9a24b" stroke-width="1.1">
          <rect x="2.5" y="2.5" width="29" height="29"/>
          <path d="M17 5 L17 29 M5 17 L29 17 M8 8 L26 26 M26 8 L8 26"/>
          <circle cx="17" cy="17" r="5" fill="#0d3a2c"/>
        </g>
      </svg>
      <span class="name" data-ru="RAG с нуля" data-en="RAG from zero">RAG с нуля</span>
    </div>
    <div class="toggle" role="group" aria-label="Language">
      <button id="b-ru" aria-pressed="true" onclick="setLang('ru')">RU</button>
      <button id="b-en" aria-pressed="false" onclick="setLang('en')">EN</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <svg class="sun" width="120" height="60" viewBox="0 0 120 60" aria-hidden="true">
      <g stroke="#c9a24b" stroke-width="1" fill="none">
        <path d="M60 58 L60 6 M60 58 L36 12 M60 58 L84 12 M60 58 L18 24 M60 58 L102 24 M60 58 L8 42 M60 58 L112 42"/>
        <path d="M8 58 H112" stroke="#7d6a3a"/>
      </g>
      <circle cx="60" cy="58" r="4" fill="#e3c987"/>
    </svg>
    <p class="eyebrow" data-ru="Гайд" data-en="The Guide">Гайд</p>
    <h1><span data-ru="RAG" data-en="RAG">RAG</span> <span class="amp" data-ru="с нуля" data-en="from zero">с нуля</span></h1>
    <p class="lede" data-ru="Пошаговый гайд для новичков: от 0 до 100%. Без подготовки, всё на одной странице."
       data-en="A step-by-step guide for beginners: from 0 to 100%. No prerequisites, all on one page.">
       Пошаговый гайд для новичков: от 0 до 100%. Без подготовки, всё на одной странице.</p>
    <div class="rule"><span class="ln"></span><span class="dot"></span><span class="ln"></span></div>
  </section>

  <section>
    <div class="track-head">
      <h2 class="ttl" data-ru="Маршрут обучения" data-en="The Learning Track">Маршрут обучения</h2>
      <p class="sub" data-ru="От 0% до 100%" data-en="From 0% to 100%">От 0% до 100%</p>
    </div>

    <div class="meter">
      <span class="cap" data-ru="Прогресс" data-en="Progress">Прогресс</span>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <span class="lbl" id="meterlbl">0%</span>
    </div>

    <div class="ladder" id="ladder"></div>
  </section>
</main>

<footer>
  <div class="wrap fbar">
    <svg class="fan" width="90" height="34" viewBox="0 0 90 34" aria-hidden="true">
      <g stroke="#7d6a3a" stroke-width="1" fill="none">
        <path d="M45 32 L45 4 M45 32 L27 8 M45 32 L63 8 M45 32 L12 18 M45 32 L78 18"/>
      </g>
      <circle cx="45" cy="32" r="3" fill="#c9a24b"/>
    </svg>
    <div class="flinks">
      <a href="https://brewpage.app" target="_blank" rel="noopener">brewpage.app</a>
      <span class="sep" aria-hidden="true"></span>
      <a href="https://github.com/kochetkov-ma/brewpage-openapi" target="_blank" rel="noopener">brewpage-openapi</a>
    </div>
    <p class="fnote" data-ru="RAG с нуля" data-en="RAG from zero">RAG с нуля</p>
  </div>
</footer>

<script>
  var STOPS = [
    {pct:"0%", t:["С чего начать","Where to start"],
     b:["Эта страница ведёт от полного нуля до рабочего понимания RAG, шаг за шагом.","This page takes you from complete zero to a working understanding of RAG, step by step."],
     s:[["Ничего не нужно знать заранее","No prior knowledge required"],["Каждый шаг строится на предыдущем","Each step builds on the previous one"],["Откройте любую остановку, чтобы раскрыть её","Open any stop to expand it"]]},
    {pct:"1", t:["Что такое RAG","What RAG is"],
     b:["RAG -- это связка поиска по вашим данным и языковой модели, которая пишет ответ.","RAG combines retrieval over your data with a language model that writes the answer."],
     s:[["Retrieval-Augmented Generation","Retrieval-Augmented Generation"],["Модель отвечает по найденным фрагментам","The model answers from retrieved fragments"],["Меньше выдумок, больше фактов","Fewer hallucinations, more facts"]]},
    {pct:"2", t:["Зачем он нужен","Why you need it"],
     b:["Модель не знает ваших документов; RAG даёт ей нужный контекст прямо в запросе.","The model does not know your documents; RAG feeds it the right context at query time."],
     s:[["Свежие и приватные данные","Fresh and private data"],["Ответы со ссылкой на источник","Answers grounded in sources"],["Не нужно дообучать модель","No fine-tuning required"]]},
    {pct:"3", t:["Как работает поиск по документам","How document retrieval works"],
     b:["По запросу система находит самые близкие по смыслу куски текста.","For a query the system finds the chunks closest in meaning."],
     s:[["Запрос превращается в вектор","The query becomes a vector"],["Сравнение по смыслу, не по словам","Matching by meaning, not exact words"],["Возвращаются top-k фрагментов","Top-k fragments are returned"]]},
    {pct:"4", t:["Разбиваем текст на чанки","Splitting text into chunks"],
     b:["Длинные документы режутся на небольшие куски, удобные для поиска.","Long documents are cut into small pieces that are easy to search."],
     s:[["Размер с небольшим перекрытием","Sized with a small overlap"],["Сохраняем границы абзацев","Respect paragraph boundaries"],["Каждый чанк хранит метаданные","Each chunk keeps its metadata"]]},
    {pct:"5", t:["Эмбеддинги: текст в векторы","Embeddings: text to vectors"],
     b:["Модель эмбеддингов превращает текст в числа, где близость значит схожесть смысла.","An embedding model turns text into numbers where closeness means similar meaning."],
     s:[["Один вектор на чанк","One vector per chunk"],["Близкие смыслы -- близкие точки","Similar meanings sit close together"],["Запрос кодируется так же","The query is encoded the same way"]]},
    {pct:"6", t:["Векторная база и поиск","Vector store and search"],
     b:["Векторы хранятся в базе, которая быстро находит ближайших соседей.","Vectors live in a store that quickly finds nearest neighbours."],
     s:[["Поиск по близости векторов","Search by vector proximity"],["Масштабируется на миллионы чанков","Scales to millions of chunks"],["Фильтры по метаданным","Filter by metadata"]]},
    {pct:"7", t:["Собираем контекст для модели","Assembling context for the model"],
     b:["Найденные фрагменты складываются в промпт как опора для ответа.","The retrieved fragments are packed into the prompt as grounding for the answer."],
     s:[["Сначала самые релевантные","Most relevant first"],["Следим за лимитом контекста","Mind the context window"],["Добавляем инструкцию модели","Add an instruction for the model"]]},
    {pct:"8", t:["Генерация ответа","Generating the answer"],
     b:["Модель пишет ответ, опираясь только на переданный контекст.","The model writes the answer using only the supplied context."],
     s:[["Ответ со ссылками на источники","Answer cites its sources"],["Меньше выдумок","Less making things up"],["Тон и формат задаются промптом","Tone and format set by the prompt"]]},
    {pct:"9", t:["Оценка качества","Measuring quality"],
     b:["Проверяем, что ответы точны, обоснованы и полезны.","We check that answers are accurate, grounded and useful."],
     s:[["Релевантность найденного","Relevance of retrieval"],["Обоснованность ответа","Faithfulness of the answer"],["Тестовый набор вопросов","A fixed set of test questions"]]},
    {pct:"100%", t:["Вывод в продакшн","Going to production"],
     b:["Готовый пайплайн разворачивается, мониторится и улучшается.","The finished pipeline is deployed, monitored and improved."],
     s:[["Кэш и контроль затрат","Caching and cost control"],["Логи и обратная связь","Logging and feedback"],["Регулярное обновление данных","Regular data refresh"]]}
  ];

  var lang = "ru";

  function buildLadder(){
    var L = document.getElementById("ladder");
    var html = "";
    for(var i=0;i<STOPS.length;i++){
      var s = STOPS[i];
      var subs = "";
      for(var j=0;j<s.s.length;j++){
        subs += '<li data-ru="'+s.s[j][0]+'" data-en="'+s.s[j][1]+'">'+s.s[j][0]+'</li>';
      }
      var pctLabel = (s.pct==="0%"||s.pct==="100%") ? s.pct : s.pct+"/9";
      var stepCap = '<small data-ru="ШАГ" data-en="STEP">ШАГ</small>';
      html +=
        '<div class="stop" data-i="'+i+'">'+
          '<div class="frame">'+
            '<button class="stopbtn" onclick="toggle('+i+')" aria-expanded="false">'+
              '<span class="pct">'+s.pct+(s.pct!=="0%"&&s.pct!=="100%"?stepCap:'')+'</span>'+
              '<span class="stoptitle" data-ru="'+s.t[0]+'" data-en="'+s.t[1]+'">'+s.t[0]+'</span>'+
              '<span class="chev" aria-hidden="true">'+
                '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 6 L8 11 L13 6" fill="none" stroke="#c9a24b" stroke-width="1.4"/></svg>'+
              '</span>'+
            '</button>'+
            '<div class="panel"><div class="panel-in">'+
              '<p class="blurb" data-ru="'+s.b[0]+'" data-en="'+s.b[1]+'">'+s.b[0]+'</p>'+
              '<ul class="subs">'+subs+'</ul>'+
            '</div></div>'+
          '</div>'+
        '</div>';
    }
    L.innerHTML = html;
  }

  function toggle(i){
    var st = document.querySelector('.stop[data-i="'+i+'"]');
    var open = st.classList.toggle("open");
    st.querySelector(".stopbtn").setAttribute("aria-expanded", open?"true":"false");
    updateMeter();
  }

  function updateMeter(){
    var stops = document.querySelectorAll(".stop");
    var opened = document.querySelectorAll(".stop.open").length;
    var p = Math.round(opened/stops.length*100);
    document.getElementById("fill").style.width = p+"%";
    document.getElementById("meterlbl").textContent = p+"%";
  }

  function setLang(l){
    lang = l;
    document.documentElement.lang = l;
    document.getElementById("b-ru").setAttribute("aria-pressed", l==="ru"?"true":"false");
    document.getElementById("b-en").setAttribute("aria-pressed", l==="en"?"true":"false");
    var nodes = document.querySelectorAll("[data-"+l+"]");
    for(var i=0;i<nodes.length;i++){
      nodes[i].textContent = nodes[i].getAttribute("data-"+l);
    }
  }

  buildLadder();
  setLang("ru");
  updateMeter();
</script>
